name: Test conflicting auth - api-key with audience
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy policy file
        run: |
          echo '{}' > ./policy.hujson

      - id: action
        uses: .
        continue-on-error: true
        with:
          tailnet: "example.com"
          policy-file: ./policy.hujson
          action: test
          api-key: "tskey-api-fake123"
          audience: "https://tailscale.com"
          # api-key + audience is a conflicting combination

      - name: Assert action failed due to conflicting auth (api-key + audience)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when api-key and audience were both provided"
          else
            echo "FAIL: expected action to fail with conflicting auth (api-key + audience), but got outcome '$OUTCOME'"
            exit 1
          fi

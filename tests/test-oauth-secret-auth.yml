name: Test oauth-secret auth passes validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dummy policy file
        run: |
          cat > ./policy.hujson << 'EOF'
          {
            "ACLs": [
              {
                "Action": "accept",
                "Src": ["*"],
                "Dst": ["*:*"]
              }
            ]
          }
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          tailnet: "example.com"
          policy-file: ./policy.hujson
          action: test
          oauth-client-id: "fake-client-id"
          oauth-secret: "tskey-client-secret-fake789"
          # oauth-client-id + oauth-secret provided (no api-key or audience)
          # Auth validation should pass; pusher will fail with fake credentials
      - name: Assert action ran (not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran and produced outcome '$OUTCOME' (expected failure at pusher with fake credentials)"

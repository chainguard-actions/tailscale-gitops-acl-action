name: Test missing auth credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy policy file
        run: |
          echo '{}' > ./policy.hujson

      - id: action
        uses: .
        continue-on-error: true
        with:
          tailnet: "example.com"
          policy-file: ./policy.hujson
          action: test
          # No api-key, oauth-client-id, or oauth-secret provided

      - name: Assert action failed due to missing auth
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when no auth credentials were provided"
          else
            echo "FAIL: expected action to fail with missing auth, but got outcome '$OUTCOME'"
            exit 1
          fi

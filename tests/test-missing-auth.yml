name: Test missing auth fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy policy file
        run: |
          echo '{}' > "$GITHUB_WORKSPACE/policy.hujson"

      - id: action
        uses: .
        continue-on-error: true
        with:
          tailnet: "example.com"
          policy-file: ./policy.hujson
          action: test
          # No api-key, oauth-secret, or oauth-client-id provided

      - name: Assert action failed due to missing auth
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when no auth was provided"
          else
            echo "FAIL: expected failure due to missing auth, got '$OUTCOME'"
            exit 1
          fi

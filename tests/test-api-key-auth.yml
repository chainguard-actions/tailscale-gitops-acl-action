name: Test action with api-key auth (test mode)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy policy file
        run: |
          cat > "$GITHUB_WORKSPACE/policy.hujson" <<'EOF'
          {
            "acls": [
              {"action": "accept", "src": ["*"], "dst": ["*:*"]}
            ]
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          tailnet: "example.com"
          api-key: "tskey-api-fake-key-for-testing"
          policy-file: ./policy.hujson
          action: test

      - name: Assert action ran (passed auth validation, may fail on API call)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but valid)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully after passing auth validation (expected with fake credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME' — expected success or failure, not '$OUTCOME'"
            exit 1
          fi

name: Test oauth-client-id auth input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          tailnet: example.com
          oauth-client-id: fake-client-id
          audience: fake-audience
          policy-file: ./policy.hujson
          action: test

      - name: Assert action ran with oauth-client-id input (expected to fail without real OIDC credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no real OIDC credentials in harness)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly (real credentials may be present)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

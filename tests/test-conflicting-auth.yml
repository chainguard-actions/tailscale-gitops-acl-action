name: Test conflicting auth credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dummy policy file
        run: |
          echo '{}' > ./policy.hujson
      - id: action
        uses: .
        continue-on-error: true
        with:
          tailnet: "example.com"
          policy-file: ./policy.hujson
          action: test
          api-key: "tskey-api-fake123"
          oauth-secret: "tskey-client-secret-fake456"
          # Both api-key and oauth-secret provided — should fail
      - name: Assert action failed due to conflicting auth
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when conflicting auth credentials are provided, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when conflicting auth credentials were provided"
